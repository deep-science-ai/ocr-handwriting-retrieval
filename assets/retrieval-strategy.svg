<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="540" viewBox="0 60 1120 540" role="img" aria-labelledby="title desc">
  <title id="title">Handwriting OCR and LanceDB retrieval strategy</title>
  <desc id="desc">A pipeline diagram showing handwritten images ingested into LanceDB, enriched with OCR text, structured fields, summaries, vectors, and retrieved with dense search plus optional late-interaction reranking.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f5d62"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#19323a" flood-opacity="0.14"/>
    </filter>
    <style>
      .bg { fill: #f7f8f4; }
      .band { fill: #e7f0ed; }
      .retrieval-band { fill: #eef1fb; opacity: 0.58; }
      .card { fill: #ffffff; stroke: #c9d7d2; stroke-width: 1.4; filter: url(#shadow); }
      .table { fill: #fdf9ea; stroke: #d9c96f; stroke-width: 1.6; filter: url(#shadow); }
      .query { fill: #eef0fb; stroke: #b8bfdf; stroke-width: 1.4; filter: url(#shadow); }
      .rerank { fill: #f8ece6; stroke: #debba8; stroke-width: 1.4; filter: url(#shadow); }
      .title { font: 700 24px Arial, sans-serif; fill: #17343b; }
      .subtitle { font: 400 15px Arial, sans-serif; fill: #4d6266; }
      .label { font: 700 17px Arial, sans-serif; fill: #17343b; }
      .small { font: 400 13px Arial, sans-serif; fill: #465c60; }
      .tiny { font: 400 12px Arial, sans-serif; fill: #5a6c70; }
      .mono { font: 600 12px Menlo, Consolas, monospace; fill: #315057; }
      .arrow { stroke: #2f5d62; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .soft-arrow { stroke: #7d8e91; stroke-width: 1.8; stroke-dasharray: 6 5; fill: none; marker-end: url(#arrow); }
      .pill { fill: #eef6f3; stroke: #c6d9d2; stroke-width: 1; }
      .pill-text { font: 600 12px Arial, sans-serif; fill: #315057; }
      .section-label { font: 800 13px Arial, sans-serif; letter-spacing: 1.2px; fill: #315057; }
      .image-line { stroke: #5d6d70; stroke-width: 4; stroke-linecap: round; }
      .image-thin { stroke: #5d6d70; stroke-width: 2.6; stroke-linecap: round; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1120" height="620"/>
  <rect class="band" x="40" y="94" width="1040" height="284" rx="18"/>
  <rect class="retrieval-band" x="40" y="392" width="1040" height="188" rx="18"/>

  <text class="section-label" x="64" y="118">STORAGE</text>
  <text class="section-label" x="64" y="416">RETRIEVAL</text>

  <rect class="card" x="58" y="136" width="170" height="146" rx="10"/>
  <text class="label" x="82" y="166">Handwritten PNGs</text>
  <rect x="92" y="186" width="102" height="58" rx="5" fill="#f3f5f2" stroke="#cbd5d2"/>
  <path class="image-line" d="M108 207 C126 191, 138 224, 154 205 S180 205, 184 224"/>
  <path class="image-thin" d="M110 232 C127 225, 143 239, 158 229 S180 229, 185 237"/>
  <text class="small" x="82" y="265">raw image bytes</text>

  <path class="arrow" d="M232 209 H294"/>

  <rect class="table" x="304" y="112" width="262" height="214" rx="12"/>
  <text class="label" x="332" y="145">LanceDB table</text>
  <text class="small" x="332" y="169">Native image column plus metadata</text>
  <rect class="pill" x="332" y="194" width="82" height="25" rx="12"/>
  <text class="pill-text" x="351" y="211">image</text>
  <rect class="pill" x="424" y="194" width="78" height="25" rx="12"/>
  <text class="pill-text" x="440" y="211">labels</text>
  <rect class="pill" x="332" y="229" width="88" height="25" rx="12"/>
  <text class="pill-text" x="351" y="246">ocr_text</text>
  <rect class="pill" x="431" y="229" width="98" height="25" rx="12"/>
  <text class="pill-text" x="448" y="246">summary</text>
  <rect class="pill" x="332" y="264" width="80" height="25" rx="12"/>
  <text class="pill-text" x="351" y="281">vector</text>
  <rect class="pill" x="423" y="264" width="105" height="25" rx="12"/>
  <text class="pill-text" x="441" y="281">review flag</text>

  <path class="arrow" d="M568 169 H635"/>
  <rect class="card" x="648" y="112" width="190" height="96" rx="10"/>
  <text class="label" x="674" y="145">DSPy OCR</text>
  <text class="small" x="674" y="169">VLM reads image bytes</text>
  <text class="mono" x="674" y="190">image -> ocr_text</text>

  <path class="arrow" d="M568 256 H635"/>
  <rect class="card" x="648" y="230" width="190" height="96" rx="10"/>
  <text class="label" x="674" y="263">DSPy extraction</text>
  <text class="small" x="674" y="287">normalized fields</text>
  <text class="mono" x="674" y="308">ocr_text -> summary</text>

  <path class="soft-arrow" d="M743 210 V227"/>
  <path class="arrow" d="M840 278 H907"/>
  <rect class="card" x="920" y="230" width="150" height="96" rx="10"/>
  <text class="label" x="948" y="263">Embedding</text>
  <text class="small" x="948" y="287">summary vector</text>
  <text class="mono" x="948" y="308">vector_idx</text>

  <path class="soft-arrow" d="M996 228 V158 H570"/>
  <text class="tiny" x="850" y="145">write vectors back</text>
  <text class="tiny" x="850" y="160">to the same table</text>

  <rect class="query" x="58" y="430" width="206" height="104" rx="12"/>
  <text class="label" x="88" y="463">User query</text>
  <text class="small" x="88" y="487">"antibiotic for infection"</text>
  <text class="mono" x="88" y="510">query -> vector</text>

  <path class="arrow" d="M268 482 H334"/>
  <rect class="table" x="348" y="406" width="222" height="152" rx="12"/>
  <text class="label" x="379" y="438">Stage 1</text>
  <text class="small" x="379" y="463">Dense vector search</text>
  <text class="mono" x="379" y="486">top 50 candidates</text>
  <text class="tiny" x="379" y="512">bounded select: image, labels,</text>
  <text class="tiny" x="379" y="530">OCR text, summary</text>

  <path class="arrow" d="M574 482 H640"/>
  <rect class="rerank" x="654" y="406" width="222" height="152" rx="12"/>
  <text class="label" x="688" y="438">Stage 2</text>
  <text class="small" x="688" y="463">Late-interaction rerank</text>
  <text class="mono" x="688" y="486">MaxSim over candidates</text>
  <text class="tiny" x="688" y="512">optional, recomputed for top rows</text>

  <path class="arrow" d="M880 482 H946"/>
  <rect class="card" x="960" y="406" width="130" height="152" rx="12"/>
  <text class="label" x="989" y="438">Results</text>
  <text class="small" x="989" y="463">Romycin</text>
  <text class="small" x="989" y="486">Azithromycin</text>
  <text class="small" x="989" y="509">ocr: Ramycin</text>
  <text class="small" x="989" y="532">dense rank: 9</text>

  <path class="soft-arrow" d="M459 404 V331"/>
  <text class="tiny" x="478" y="363">retrieval reads from</text>
  <text class="tiny" x="478" y="378">the same enriched table</text>
</svg>
